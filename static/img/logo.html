<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #DFD3B8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    }
    .logo {
      text-align: center;
    }
    
    /* Cercle parfait */
    .circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      border: 4px solid #EA4335;
      transition: transform 0.3s ease;
    }
    
    .circle:hover {
      transform: scale(1.03);
    }
    
    /* Le E - proportions parfaites */
    .letter-e {
      position: relative;
      width: 64px;
      height: 80px;
    }
    
    .e-vertical {
      position: absolute;
      left: 0;
      top: 0;
      width: 18px;
      height: 80px;
      background: #4285F4;
      border-radius: 4px;
    }
    
    .e-top {
      position: absolute;
      left: 9px;
      top: 0;
      width: 55px;
      height: 18px;
      background: #EA4335;
      border-radius: 4px;
    }
    
    .e-mid {
      position: absolute;
      left: 9px;
      top: 31px;
      width: 47px;
      height: 18px;
      background: #FBBC05;
      border-radius: 4px;
    }
    
    .e-bottom {
      position: absolute;
      left: 9px;
      top: 62px;
      width: 55px;
      height: 18px;
      background: #34A853;
      border-radius: 4px;
    }
    
    .title {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-top: 16px;
      line-height: 1;
    }
    .title .examens { 
      color: #1A1A1A;
      font-weight: 800;
    }
    .title .cam { 
      color: #EA4335;
      font-weight: 800;
    }
  </style>
</head>
<body>

<div class="logo">
  <div class="circle">
    <div class="letter-e">
      <div class="e-vertical"></div>
      <div class="e-top"></div>
      <div class="e-mid"></div>
      <div class="e-bottom"></div>
    </div>
  </div>
  
  <div class="title">
    <span class="examens">EXAMENS</span>
    <span class="cam">CAM</span>
  </div>
</div>

</body>
</html>
