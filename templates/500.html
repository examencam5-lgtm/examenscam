{% extends 'base.html' %}
{% block title %}Erreur · ExamensCam{% endblock %}

{% block content %}
<style>
  :root {
    --navy: #0D1B2A; --blue: #1A5276;
    --gold: #D4AC0D; --white: #FFFFFF;
    --muted: #5D6D7E; --bg: #F4F6F8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Lato', sans-serif; background: var(--bg); }

  .error-page {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 24px;
  }

  .error-code {
    font-family: 'Cormorant Garamond', serif;
    font-size: 96px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
    margin-bottom: 4px;
    opacity: 0.12;
  }

  .error-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 12px;
  }

  .error-sub {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 36px;
    line-height: 1.6;
    max-width: 380px;
  }

  .gold-line {
    width: 48px; height: 2px;
    background: var(--gold);
    margin: 0 auto 32px;
    opacity: 0.7;
  }

  .btn-home {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    background: var(--navy);
    color: var(--white);
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    transition: opacity 0.2s;
  }

  .btn-home:hover { opacity: 0.85; color: var(--white); }
</style>

<div class="error-page">
  <div class="error-code">500</div>
  <h1 class="error-title">Un problème est survenu</h1>
  <div class="gold-line"></div>
  <p class="error-sub">
    Quelque chose s'est mal passé de notre côté. Réessaie dans quelques instants.
  </p>
  <a href="/" class="btn-home">&larr; Retour à l'accueil</a>
</div>
{% endblock %}
